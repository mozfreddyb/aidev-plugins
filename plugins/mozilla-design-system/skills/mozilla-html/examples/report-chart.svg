<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" font-size="13">
  <desc>Illustrative pipeline latency: Path A is 64 ms and Path B is 77 ms.</desc>
  <text x="80" y="38" text-anchor="end">Path A</text>
  <rect x="95" y="20" width="320" height="28" fill="var(--chart-1)"><title>64 ms</title></rect>
  <text x="425" y="38" class="label">64 ms</text>
  <text x="80" y="98" text-anchor="end">Path B</text>
  <rect x="95" y="80" width="385" height="28" fill="var(--chart-2)"><title>77 ms</title></rect>
  <text x="490" y="98" class="label">77 ms</text>
  <line x1="95" x2="580" y1="125" y2="125" class="axis"/>
  <text x="95" y="145">0 ms</text><text x="580" y="145" text-anchor="end">100 ms</text>
</svg>
